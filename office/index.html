<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: a 3D office floor you orbit and walk through; conversations open as a side panel (bottom sheet on phones) */
:root{
  --bg:#e7ebea; --panel:#ffffff; --ink:#16242a; --muted:#5f6e72; --line:#d3dbda;
  --accent:#b8860b; --accent-ink:#ffffff; --deep:#1d3b44; --deep-ink:#eaf2f1;
  --bubble-me:#1d3b44; --bubble-me-ink:#f3f7f6; --bubble-ai:#f3f5f4; --soft:#e3e9e8; --ok:#2f8f5b; --warn:#b4541f;
  --s-bg:#dfe6e5; --s-floor:#d6c7ab; --s-carpet:#bfcac8; --s-wall:#e9e4da; --s-trim:#34474d; --s-desk:#f3ede1; --s-wood:#a7865c;
  --s-chair:#3f5259; --s-table:#8b6a45; --s-glass:#9fd0dd; --s-plant:#4f8a5b; --s-pot:#c9b28f; --s-screen:#55656b; --s-screen-on:#6fdcff;
  --s-sofa:#5d7f86; --s-rug:#c7a46f; --s-window:#bfe3ee; --tag-bg:#ffffff; --tag-ink:#16242a;
  --s-exec:#8c2f39; --s-exec-wood:#4a2e1f; --s-leather:#1c1c1e; --s-panel:#7a5236; --s-tile:#e9e6df; --s-play:#2f4858; --s-pong:#1f6f4a; --s-gold:#c9a227;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --panel:#141f23; --ink:#e3ebe9; --muted:#93a3a6; --line:#25353a;
  --accent:#e0ac3a; --accent-ink:#1a1405; --deep:#0a1214; --deep-ink:#dbe7e5;
  --bubble-me:#2a5562; --bubble-me-ink:#f0f6f5; --bubble-ai:#1a282d; --soft:#1e2e33; --ok:#5cc28a; --warn:#e98a55;
  --s-bg:#0d1416; --s-floor:#4a4033; --s-carpet:#2a383d; --s-wall:#3a3f42; --s-trim:#0b1214; --s-desk:#5b554b; --s-wood:#5e4a33;
  --s-chair:#1f2b30; --s-table:#5a432b; --s-glass:#3f7d90; --s-plant:#3c7048; --s-pot:#6d5d47; --s-screen:#2b373b; --s-screen-on:#5fd4ff;
  --s-sofa:#34515a; --s-rug:#6a5236; --s-window:#2d5670; --tag-bg:#22323a; --tag-ink:#eef4f3;
  --s-exec:#5a1f27; --s-exec-wood:#2e1c13; --s-leather:#0f0f10; --s-panel:#4a3222; --s-tile:#3a3936; --s-play:#1c2c36; --s-pong:#17573a; --s-gold:#b8921f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --panel:#141f23; --ink:#e3ebe9; --muted:#93a3a6; --line:#25353a;
  --accent:#e0ac3a; --accent-ink:#1a1405; --deep:#0a1214; --deep-ink:#dbe7e5;
  --bubble-me:#2a5562; --bubble-me-ink:#f0f6f5; --bubble-ai:#1a282d; --soft:#1e2e33; --ok:#5cc28a; --warn:#e98a55;
  --s-bg:#0d1416; --s-floor:#4a4033; --s-carpet:#2a383d; --s-wall:#3a3f42; --s-trim:#0b1214; --s-desk:#5b554b; --s-wood:#5e4a33;
  --s-chair:#1f2b30; --s-table:#5a432b; --s-glass:#3f7d90; --s-plant:#3c7048; --s-pot:#6d5d47; --s-screen:#2b373b; --s-screen-on:#5fd4ff;
  --s-sofa:#34515a; --s-rug:#6a5236; --s-window:#2d5670; --tag-bg:#22323a; --tag-ink:#eef4f3;
  --s-exec:#5a1f27; --s-exec-wood:#2e1c13; --s-leather:#0f0f10; --s-panel:#4a3222; --s-tile:#3a3936; --s-play:#1c2c36; --s-pong:#17573a; --s-gold:#b8921f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{background:var(--deep);color:var(--deep-ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-display);font-size:1.2rem;margin:0}
.now{flex:1;min-width:0;font-size:.84rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{color:var(--accent)}
.tb{border:1px solid color-mix(in srgb,var(--deep-ink) 28%,transparent);background:transparent;color:var(--deep-ink);border-radius:8px;padding:6px 11px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.tb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tb[aria-pressed="true"]{background:color-mix(in srgb,var(--deep-ink) 16%,transparent)}
.tb svg{width:16px;height:16px}
.main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;min-width:0;position:relative;background:var(--s-bg);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;outline:none}
.ctrl{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.ctrl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.1rem;line-height:1}
.nav{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));left:60px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;pointer-events:none}
.nav button{pointer-events:auto;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.82rem}
.nav button:hover{border-color:var(--accent)}
.hint{position:absolute;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.hint span{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--muted);text-align:center}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.panel{width:430px;flex:none;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.p-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:12px 16px}
.p-head .meta{flex:1;min-width:0}
.p-head h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
.p-head p{margin:0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff}
.sb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font-size:.78rem;color:var(--muted)}
.sb.danger{color:var(--warn);border-color:var(--warn)}
.log{flex:1;overflow-y:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start;min-width:0}
.msg .av{width:28px;height:28px;font-size:.78rem}
.msg.me{flex-direction:row-reverse}
.col{min-width:0;max-width:100%}
.msg:not(.me) .col{flex:1}
.bubble{background:var(--bubble-ai);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--bubble-me);color:var(--bubble-me-ink);border-color:transparent;white-space:pre-wrap}
.who{font-size:.76rem;color:var(--muted);font-weight:600}
.bubble h4{font-family:var(--f-display);margin:.4em 0 .2em;font-size:.98rem}
.bubble p{margin:.3em 0} .bubble ul,.bubble ol{margin:.3em 0;padding-inline-start:1.3em}
.bubble pre{background:var(--soft);border-radius:8px;padding:8px;overflow-x:auto;direction:ltr;text-align:left;font-family:var(--f-mono);font-size:.8rem}
.bubble code{font-family:var(--f-mono);font-size:.85em;background:var(--soft);padding:1px 4px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble a{color:var(--accent);font-weight:600}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.tools button{border:0;background:transparent;color:var(--muted);font-size:.76rem;padding:2px 4px}
.thinking{color:var(--muted);font-style:italic}
.cards{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;margin-top:4px}
.cards canvas{flex:none;width:118px;height:auto;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft)}
.intro{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.intro h3{font-family:var(--f-display);margin:0 0 4px;font-size:1rem}
.intro p{margin:0;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.82rem;text-align:start}
.chip:hover{border-color:var(--accent)}
.compose{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.compose form{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;max-height:160px;line-height:1.6}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.send.stop{background:var(--warn);color:#fff}
.send:disabled{opacity:.5;cursor:default}
.mic{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--warn);border-color:var(--warn);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 25%,transparent)}}
.attendees{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.att{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--bg)}
.att input{margin:0;accent-color:var(--accent)}
.att .dot{width:10px;height:10px;border-radius:50%}
.notice{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:8px 12px;font-size:.84rem;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(500px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(0 0 0 / .55)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h3{font-family:var(--f-display);margin:0}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
dialog input,dialog textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
#viewDlg{width:min(760px,calc(100vw - 24px))}
.viewer{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.viewer canvas{max-width:100%;max-height:68vh;width:auto;height:auto;border-radius:8px;box-shadow:0 6px 30px rgb(0 0 0 / .2)}
.viewer .row{width:100%;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
@media (max-width:860px){
  .panel{position:fixed;inset:auto 0 0 0;height:84%;width:auto;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 40px rgb(0 0 0 / .25);z-index:20;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .now{order:5;flex-basis:100%}
}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <h1>مكتبي الذكي</h1>
    <div class="now" id="now"></div>
    <button class="tb primary" id="meetBtn">عقد اجتماع</button>
    <button class="tb" id="voiceBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="voiceLbl">الصوت يعمل</span></button>
    <button class="tb" id="companyBtn">بيانات شركتي</button>
    <button class="tb" id="hireBtn">توظيف</button>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="gl" tabindex="0" aria-label="المكتب ثلاثي الأبعاد: اضغط على أي موظف للتحدث معه، اسحب للف الكاميرا"></canvas>
      <div class="nav" aria-label="تنقّل سريع">
        <button id="goMine">مكتبي</button>
        <button id="goTeam">الموظفون</button>
        <button id="goMeet">الاجتماعات</button>
        <button id="goBreak">المطعم والألعاب</button>
      </div>
      <div class="ctrl">
        <button id="zin" aria-label="تقريب">+</button>
        <button id="zout" aria-label="تبعيد">−</button>
        <button id="zreset" aria-label="إعادة الكاميرا">⟲</button>
      </div>
      <div class="hint"><span id="hint">اضغط على أي موظف لتكلّفه بمهمة · اسحب لتدوير المكتب · اضغط على الأرض للمشي</span></div>
    </div>
    <aside class="panel" id="panel" hidden>
      <div class="p-head">
        <div class="av" id="pAv" aria-hidden="true"></div>
        <div class="meta"><h2 id="pName"></h2><p id="pRole"></p></div>
        <button class="sb" id="editBtn">تعديل</button>
        <button class="sb" id="clearBtn">مسح</button>
        <button class="sb" id="closeBtn" aria-label="إغلاق">✕</button>
      </div>
      <div class="log" id="log"></div>
      <div class="compose">
        <div class="notice" id="notice" hidden></div>
        <div class="attendees" id="attendees" hidden></div>
        <form id="form">
          <textarea id="input" rows="1" aria-label="رسالتك"></textarea>
          <button class="mic" id="micBtn" type="button" aria-label="تكلّم بصوتك" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="send" id="sendBtn" type="submit">إرسال</button>
        </form>
      </div>
    </aside>
  </div>
</div>

<dialog id="empDlg" dir="rtl" lang="ar">
  <form id="empForm" method="dialog">
    <h3 id="empTitle">توظيف موظف جديد</h3>
    <label>الاسم<input id="empName" required maxlength="20" placeholder="مثال: هند"></label>
    <label>المسمّى الوظيفي<input id="empRole" required maxlength="50" placeholder="مثال: مديرة المشتريات"></label>
    <label>وصف العمل وطريقة الرد<textarea id="empDesc" rows="5" required placeholder="ماذا يعمل هذا الموظف؟ ما أسلوبه؟ ما الذي يركّز عليه؟"></textarea></label>
    <div class="row">
      <button type="button" class="sb danger" id="empDelete" hidden>إنهاء خدمة الموظف</button>
      <button type="button" class="sb" id="empCancel">إلغاء</button>
      <button type="submit" class="send">حفظ</button>
    </div>
  </form>
</dialog>
<dialog id="coDlg" dir="rtl" lang="ar">
  <form id="coForm" method="dialog">
    <h3>بيانات شركتي</h3>
    <p style="margin:0;color:var(--muted);font-size:.85rem">كل الموظفين يقرؤون هذه المعلومات قبل أي مهمة، والمصممون يستخدمون حسابك وألوانك في التصاميم.</p>
    <label>عن نشاطك<textarea id="coText" rows="5" placeholder="مثال: عندي متجر إلكتروني لبيع العطور في الرياض، عملاؤنا من الشباب…"></textarea></label>
    <label>حساب إنستغرام<input id="coHandle" placeholder="@mybrand" dir="ltr"></label>
    <label>ألوان الهوية (اختياري)<input id="coColors" placeholder="مثال: كحلي وذهبي، أو ‎#1d3b44 ‎#b8860b"></label>
    <div class="row"><button type="button" class="sb" id="coCancel">إلغاء</button><button type="submit" class="send">حفظ</button></div>
  </form>
</dialog>
<dialog id="viewDlg" dir="rtl" lang="ar">
  <div class="viewer">
    <canvas id="viewCv"></canvas>
    <div class="row">
      <button class="sb" id="vPrev">→ السابق</button>
      <span id="vCount" style="color:var(--muted);font-size:.85rem"></span>
      <button class="sb" id="vNext">التالي ←</button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <span id="vMsg" style="color:var(--muted);font-size:.8rem;flex:1"></span>
      <button class="sb" id="vClose">إغلاق</button>
      <button class="send" id="vSave">تحميل الصورة</button>
    </div>
  </div>
</dialog>

const ROOMS = [
  {has:p => p[0] > 1190 && p[1] < 470, inside:[1295,425], outside:[1295,530]},
  {has:p => p[0] > 770 && p[0] < 1190 && p[1] < 330, inside:[840,295], outside:[840,372]},
  {has:p => p[0] < 762 && p[1] > 578, inside:[380,620], outside:[380,540]}
];
function route(from, to){
  const A = ROOMS.find(r => r.has(from)), B = ROOMS.find(r => r.has(to)), pts = [];
  if(A && A !== B) pts.push(A.inside, A.outside);
  if(B && B !== A) pts.push(B.outside, B.inside);
  pts.push(to); return pts;
}
function walkTo(id, x, y, {sit=false, face=null, anim=null}={}){
  const c = chars[id]; if(!c) return 0;
  x = Math.max(30, Math.min(1570, x)); y = Math.max(40, Math.min(915, y)); c.anim = anim;
  const pts = route([c.x, c.y], [x, y]);
  let len = 0, prev = [c.x, c.y]; for(const q of pts){ len += Math.hypot(q[0]-prev[0], q[1]-prev[1]); prev = q; }
  [c.tx, c.ty] = pts[0]; c.path = pts.slice(1); c.dest = [x, y];
  c.sitOnArrive = sit; if(face !== null) c.restFace = face; c.seated = false;
  return len / 135;
}
function goHome(id){ freeActivity(id); const s = byId(id); if(s) return walkTo(id, ...homeOf(s), {sit:true, face:0}); return 0; }

function tick(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  cam.target.lerp(cam.goal, 1 - Math.pow(.02, dt));
  cam.r += (cam.rGoal - cam.r) * (1 - Math.pow(.02, dt));
  const sp = Math.sin(cam.phi);
  camera.position.set(cam.target.x + cam.r*sp*Math.sin(cam.theta), cam.target.y + cam.r*Math.cos(cam.phi), cam.target.z + cam.r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  for(const id in chars){
    const c = chars[id], dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    let moving = false;
    if(d > 2){ const step = Math.min(d, 135 * dt); c.x += dx/d*step; c.y += dy/d*step; c.face = turn(c.face, Math.atan2(dx, dy), dt*10); moving = true; }
    else if(c.path && c.path.length){ c.x = c.tx; c.y = c.ty; [c.tx, c.ty] = c.path.shift(); moving = true; }
    else { c.x = c.tx; c.y = c.ty; c.face = turn(c.face, c.restFace, dt*6); c.seated = c.sitOnArrive; }
    c.group.position.set(X3(c.x), 0, Z3(c.y)); c.body.rotation.y = c.face;
    const w = moving ? Math.sin(t*10 + c.phase) : 0;
    const sit = c.seated && !moving;
    c.body.position.y += ((sit ? -.32 : 0) - c.body.position.y) * Math.min(1, dt*10);
    c.body.position.z = 0;
    c.legs[0].rotation.x = sit ? -1.45 : w*.6; c.legs[1].rotation.x = sit ? -1.45 : -w*.6;
    const talking = speakingId === id || (!speakingId && live.meet && live.meet.from === id && live.meet.text) || (!speakingId && working[id] && live[id] && live[id].text && meeting == null && false);

  const lines = String(src).replace(/\r/g,"").split("\n"); let out = "", list = null, code = null, para = [];

    if(code !== null){ if(/^```/.test(ln)){ out += "<pre><code>"+esc(code.join("\n"))+"</code></pre>"; code = null; } else code.push(ln); continue; }
    if(/^```/.test(ln)){ fp(); cl(); code = []; continue; }

    if((m = ln.match(/^#{1,6}\s+(.*)/))){ fp(); cl(); out += "<h4>"+inline(m[1])+"</h4>"; continue; }
    if((m = ln.match(/^\s*[-*•]\s+(.*)/))){ fp(); if(list!=="ul"){ cl(); out+="<ul>"; list="ul"; } out += "<li>"+inline(m[1])+"</li>"; continue; }

    if(/^\|/.test(ln) || /^-{3,}$/.test(ln.trim())){ fp(); cl(); out += "<pre><code>"+esc(ln)+"</code></pre>"; continue; }
    cl(); para.push(ln);

}
function plain(src){

وصف عملك: ${s.desc}
${company ? "معلومات عن نشاط المدير وشركته:\n" + company + "\n" : ""}${handle ? "حساب إنستغرام: " + handle + "\n" : ""}${brandColors ? "ألوان الهوية: " + brandColors + "\n" : ""}

- رد بالعربية، وبلهجة قريبة من لهجة المدير إن كتب بالعامية، وبالفصحى المبسطة إن كتب بالفصحى.
- قدّم عملًا جاهزًا للاستخدام (نصوص، جداول، خطوات، كود) لا مجرد نصائح عامة.

      else reply = {role:"assistant", content: String((d && d.message) || "ما قدرت أطلع التصميم هالمرة، أعد الطلب بتفاصيل أكثر.")};
    } else {
      const r = await sample(turns, {cache:false, signal:ctl.signal, tools:toolsFor(s, id), onText:({text}) => { live[id].text = text; updateLive(id); }});
      reply = {role:"assistant", content:r.text};
    }
  }catch(e){
    if(e && e.code !== "aborted") notice(errText(e));
    if(e && e.text && !s.kind) reply = {role:"assistant", content:e.text};
  }
  delete working[id]; delete live[id];
  if(reply){ hist.push(reply); } else { hist.pop(); }
  store.set("chats", chats);
  const viewingIt = target && target.type === "emp" && target.id === id && !$("panel").hidden;
  if(reply && !viewingIt){ unread[id] = true; store.set("unread", unread); }
  if(reply && voiceOn) speakQueue(id, reply.content);
  refreshStatuses(); if(viewingIt){ renderLog(); renderComposer(); }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runMeeting(topic){
  const team = staff().filter(s => attendees.includes(s.id) && !working[s.id]).slice(0, SEATS.length);
  if(!team.length){ notice("اختر موظفًا واحدًا على الأقل (ومتاحًا) لحضور الاجتماع."); return; }
  notice("");
  team.forEach(s => freeActivity(s.id));
  meeting = {ctl:new AbortController(), team};
  meetLog.push({from:"me", content:topic}); store.set("meet", meetLog);
  let longest = walkTo("me", HEAD_SEAT[0], HEAD_SEAT[1], {sit:true, face:-Math.PI/2});
  team.forEach((s,i) => { const [x,y] = SEATS[i]; longest = Math.max(longest, walkTo(s.id, x, y, {sit:true, face: y < 182 ? 0 : Math.PI})); });
  focusOn(980, 190, 13);
  refreshStatuses(); renderLog(); renderComposer();
  await sleep(Math.min(longest, 6) * 1000 + 400);
  const said = [];
  for(const s of team){
    if(meeting.ctl.signal.aborted) break;
    const prompt = persona(s) + `\n\n---\nأنت الآن في اجتماع مع المدير وزملائك (${team.map(t => t.name + " - " + t.role).join("، ")}).
موضوع المدير: ${topic}
${said.length ? "\nما قاله الزملاء قبلك:\n" + said.map(x => "[" + x.n + "]: " + x.t).join("\n\n") : ""}
\nتكلّم كأنك في اجتماع حقيقي: مساهمتك من زاوية تخصصك فقط، 70-130 كلمة، جمل قصيرة تُقرأ بصوت عالٍ، ونقاط عملية محددة. ابنِ على كلام الزملاء ولا تكرره.`;
    live.meet = {from:s.id, text:""}; refreshStatuses(); updateLive("meet");
    let ans = null;
    try{ const tl = toolsFor(s, "meet"); const r = await sample(prompt, {cache:false, signal:meeting.ctl.signal, tools: tl && tl.slice(0, 2), onText:({text}) => { live.meet.text = text; updateLive("meet"); }}); ans = r.text; }
    catch(e){ if(e && e.code !== "aborted") notice(errText(e)); ans = e && e.text || null; if(e && e.code === "not_granted") break; }
    delete live.meet;
    if(ans){ said.push({n:s.name, t:ans}); meetLog.push({from:s.id, name:s.name, content:ans}); store.set("meet", meetLog); speakQueue(s.id, ans); }
    refreshStatuses(); if(target && target.type === "meet") renderLog();
  }
  const lead = team.find(s => s.id === "sara") || team[0];
  if(meeting && !meeting.ctl.signal.aborted && said.length > 1){
    const prompt = persona(lead) + `\n\n---\nانتهى الاجتماع حول: ${topic}\n\nالمداخلات:\n` + said.map(x => "[" + x.n + "]: " + x.t).join("\n\n") +
      `\n\nاكتب محضر اجتماع مختصر بهذا الشكل:\n#### القرارات\n- ...\n#### المهام\n1. المهمة — المسؤول — الموعد المقترح\n#### الخطوة الأولى اليوم\nسطر واحد.`;
    live.meet = {from:lead.id, text:""}; refreshStatuses(); updateLive("meet");
    try{ const r = await sample(prompt, {cache:false, signal:meeting.ctl.signal, onText:({text}) => { live.meet.text = text; updateLive("meet"); }});
      meetLog.push({from:lead.id, name:lead.name, content:"**محضر الاجتماع**\n\n" + r.text}); store.set("meet", meetLog);
      speakQueue(lead.id, "هذا محضر الاجتماع. " + r.text.split("\n").slice(0, 12).join("\n"));
    }catch(e){ if(e && e.code !== "aborted") notice(errText(e)); }
    delete live.meet;
  }
  endMeeting(false);
}
function endMeeting(stopVoice = true){
  if(!meeting) return;
  const team = meeting.team; meeting.ctl.abort(); meeting = null; delete live.meet;
  if(stopVoice && tts) tts.stop().catch(() => {});
  const back = () => { team.forEach((s,i) => setTimeout(() => goHome(s.id), i*200)); };
  if(!stopVoice && tts && tts.active()){ const wait = setInterval(() => { if(!tts.active()){ clearInterval(wait); back(); } }, 1000); } else back();
  refreshStatuses(); if(target && target.type === "meet"){ renderLog(); renderComposer(); }
}

async function send(){
  if(!target) return;
  if(target.type === "emp" && working[target.id]){ working[target.id].abort(); return; }
  if(target.type === "meet" && meeting){ endMeeting(); return; }
  const text = $("input").value.trim(); if(!text) return;
  if(dict && dict.active()) dict.stop().catch(() => {});
  if(!await ensureCaps()){ notice("تشغيل الموظفين يحتاج فتح الصفحة داخل Claude والسماح لها باستخدام Claude."); return; }
  notice(""); $("input").value = ""; dictBase = ""; autosize();
  if(target.type === "emp") deskTask(target.id, text); else runMeeting(text);
}

/* ======================= events ======================= */
function autosize(){ const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("form").addEventListener("submit", e => { e.preventDefault(); send(); });
$("closeBtn").onclick = closePanel;
$("meetBtn").onclick = openMeeting;
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("textarea,input,dialog")) return;
  if(e.key === "Escape" && !$("panel").hidden){ closePanel(); return; }
  const k = {ArrowUp:1, ArrowDown:-1}[e.key], s = {ArrowLeft:-1, ArrowRight:1}[e.key];
  if(!k && !s) return; e.preventDefault();
  const me = chars.me; if(!me) return;
  const fx = -Math.sin(cam.theta), fz = -Math.cos(cam.theta), rx = Math.cos(cam.theta), rz = -Math.sin(cam.theta);
  const step = 40, dx = ((k||0)*fx + (s||0)*rx) * step, dy = ((k||0)*fz + (s||0)*rz) * step;
  walkTo("me", me.x + dx, me.y + dy, {sit:false});
  const near = staff().map(st => ({st, d: chars[st.id] ? Math.hypot(chars[st.id].x - me.x - dx, chars[st.id].y + 100 - me.y - dy) : 1e9})).sort((a,b) => a.d - b.d)[0];
  $("hint").textContent = near && near.d < 90 ? "اضغط على " + near.st.name + " للتحدث معه" : "اضغط على أي موظف لتكلّفه بمهمة · اسحب لتدوير المكتب · اضغط على الأرض للمشي";
});

let confirmClear = false;
$("clearBtn").onclick = () => {
  const b = $("clearBtn");
  if(!confirmClear){ confirmClear = true; b.textContent = "تأكيد؟"; b.classList.add("danger"); setTimeout(() => { confirmClear = false; b.textContent = "مسح"; b.classList.remove("danger"); }, 3000); return; }
  confirmClear = false; b.textContent = "مسح"; b.classList.remove("danger");
  if(target.type === "meet"){ if(meeting) return; meetLog = []; store.set("meet", meetLog); } else { if(working[target.id]) return; delete chats[target.id]; store.set("chats", chats); }
  renderLog();
};
let editing = null, confirmDel = false;
function openHire(){ if(freeSlot() < 0){ const n = $("now"); n.textContent = "كل المكاتب مشغولة. أنهِ خدمة موظف لتفريغ مكتب."; setTimeout(refreshStatuses, 3500); return; } openEmp(null); }
function openEmp(s){
  editing = s ? s.id : null; confirmDel = false;
  $("empTitle").textContent = s ? "تعديل بيانات " + s.name : "توظيف موظف جديد";
  $("empName").value = s ? s.name : ""; $("empRole").value = s ? s.role : ""; $("empDesc").value = s ? s.desc : "";
  $("empDelete").hidden = !s || staff().length <= 1; $("empDelete").textContent = "إنهاء خدمة الموظف";
  $("empDlg").showModal();
}
$("hireBtn").onclick = openHire;
$("editBtn").onclick = () => target && target.type === "emp" && openEmp(byId(target.id));
$("empCancel").onclick = () => $("empDlg").close();
$("empForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = {name:$("empName").value.trim(), role:$("empRole").value.trim(), desc:$("empDesc").value.trim()};
  if(!v.name || !v.role || !v.desc) return;
  let openId = editing;
  if(editing){ const c = custom.find(x => x.id === editing); if(c) Object.assign(c, v); else edits[editing] = {...(edits[editing]||{}), ...v}; }
  else {
    const slot = freeSlot(); if(slot < 0) return;
    const id = "c" + Date.now().toString(36), n = custom.length, look = LOOKS[n % LOOKS.length];
    const kind = /كاروسيل|carousel/i.test(v.role) ? "carousel" : /مصمم|تصميم|جرافيك|design/i.test(v.role) ? "graphic" : undefined;
    custom.push({id, slot, ...v, kind, color:PALETTE[n % PALETTE.length], skin:look[0], hair:look[1], style:look[2], voice:VOICES[n % 4], starters:[]});
    openId = id;
  }
  store.set("custom", custom); store.set("edits", edits);
  $("empDlg").close(); if(renderer) buildDesks(); openEmployee(openId);
});
$("empDelete").onclick = () => {
  if(!confirmDel){ confirmDel = true; $("empDelete").textContent = "اضغط مرة ثانية للتأكيد"; return; }
  if(working[editing]) working[editing].abort();
  if(custom.some(x => x.id === editing)) custom = custom.filter(x => x.id !== editing); else removed.push(editing);
  delete chats[editing]; delete unread[editing]; attendees = attendees.filter(x => x !== editing);
  store.set("custom", custom); store.set("removed", removed); store.set("chats", chats); store.set("attendees", attendees); store.set("unread", unread);
  $("empDlg").close(); closePanel(); if(renderer) buildDesks();
};
$("companyBtn").onclick = () => { $("coText").value = company; $("coHandle").value = handle; $("coColors").value = brandColors; $("coDlg").showModal(); };
$("coCancel").onclick = () => $("coDlg").close();
$("coForm").addEventListener("submit", e => { e.preventDefault(); company = $("coText").value.trim(); handle = $("coHandle").value.trim(); brandColors = $("coColors").value.trim();
  if(handle && !handle.startsWith("@")) handle = "@" + handle; store.set("company", company); store.set("handle", handle); store.set("colors", brandColors); $("coDlg").close(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme());
new MutationObserver(() => applyTheme()).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

drawVoiceBtn();
if(initGL()) document.fonts && document.fonts.ready.then(() => applyTheme());
refreshStatuses();
setTimeout(ensureCaps, 0);
// break-time life: staff with nothing to do eat, play ping pong, foosball, arcade or video games, then go back to their desks
const ACTS = [
  {anim:"pong", spots:[[838,800,Math.PI/2],[1022,800,-Math.PI/2]], dur:16},
  {anim:"fooz", spots:[[1150,752,0],[1150,848,Math.PI]], dur:14},
  {anim:"play", spots:[[1330,745,Math.PI]], dur:12},
  {anim:"play", spots:[[1460,760,Math.PI/2]], sit:true, dur:16},
  {anim:"play", spots:[[1460,840,Math.PI/2]], sit:true, dur:16},
  {anim:"eat", spots:[[112,830,-Math.PI/2]], dur:10},
  ...DINING.flatMap(([tx,ty]) => [[0,-45,0],[0,45,Math.PI],[-45,0,Math.PI/2],[45,0,-Math.PI/2]].map(([dx,dy,f]) => ({anim:"eat", spots:[[tx+dx,ty+dy,f]], sit:true, dur:18})))
];
const busySpot = new Set();
function freeActivity(id){
  const a = activity[id]; if(!a) return;
  for(const k of a.keys) busySpot.delete(k);
  for(const other of a.ids) delete activity[other];
  a.ids.filter(o => o !== id).forEach(o => { const s = byId(o); if(s && !meeting) walkTo(o, ...homeOf(s), {sit:true, face:0}); });
}
function atHome(s){ const c = chars[s.id], h = homeOf(s); return c && c.dest && c.dest[0] === h[0] && c.dest[1] === h[1] && !c.path.length; }
setInterval(() => {
  if(document.hidden || meeting || !renderer) return;
  const now = Date.now();
  for(const id of Object.keys(activity)){ const a = activity[id]; if(a && a.until < now && a.ids[0] === id) goHome(id); }
  const idle = staff().filter(s => !working[s.id] && !(target && target.id === s.id) && speakingId !== s.id && !activity[s.id] && atHome(s));
  if(!idle.length || Math.random() < .35 || Object.keys(activity).length >= 3) return;
  const options = ACTS.filter(a => a.spots.length <= idle.length && a.spots.every(sp => !busySpot.has(sp.join(","))));
  if(!options.length) return;
  const act = options[Math.floor(Math.random() * options.length)];
  const pool = idle.slice().sort(() => Math.random() - .5).slice(0, act.spots.length);
  const ids = pool.map(s => s.id), keys = act.spots.map(sp => sp.join(","));
  keys.forEach(k => busySpot.add(k));
  const rec = {act, ids, keys, until: now + act.dur*1000 + 6000};
  pool.forEach((s, i) => { activity[s.id] = rec; const [x,y,f] = act.spots[i]; walkTo(s.id, x, y, {sit:!!act.sit, face:f, anim:act.anim}); });
}, 4000);
$("goMine").onclick = () => { walkTo("me", ...ME_HOME, {sit:true, face:0}); focusOn(1390, 260, 14); };
$("goTeam").onclick = () => focusOn(390, 300, 22);
$("goMeet").onclick = () => openMeeting();
$("goBreak").onclick = () => focusOn(760, 780, 22);

})();
